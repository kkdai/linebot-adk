manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: kkdai/linebot-adk
    source: https://github.com/kkdai/linebot-adk
    branch: main
    commit: "cba791f9"
    scope: [main.py, multi_tool_agent/agent.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:34:02Z'
    url: https://a2as.org/certified/agents/kkdai/linebot-adk
  signatures:
    digest: sha256:rJLKIRztgn-K1TrKuimGF1tYylRA1kL_YOrr_ykbM3k
    key: ed25519:WYLUFcQfThkwtrAUwcMKNbndNC7yLgtrjY5M6e1foNo
    sig: ed25519:NERf61uVxpAjcXp5iPTfzzOiZJYXCkDyUgC-ah0Sx4FirYrLkgK9HD4OF44b44xzl4k9cuFCEBlEomu6d53kCg

agents:
  root_agent:
    type: instance
    models: [gemini-2.5-flash]
    tools: [get_weather, get_current_time]
    params:
      name: weather_time_agent
      description: Agent to answer questions about the time and weather in a city.
      instruction: [I can answer your questions about the time and weather in a city.]

models:
  gemini-2.5-flash:
    type: literal
    agents: [root_agent]

tools:
  get_current_time:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Returns the current time in a specified city.

        Args:
            city (str): The name of the city for which to retrieve the current time.

        Returns:
            dict: status and result or error msg.
  get_weather:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Retrieves the current weather report for a specified city.

        Args:
            city (str): The name of the city for which to retrieve the weather report.

        Returns:
            dict: status and result or error msg.

imports:
  Agent: google.adk.agents.Agent
  aiohttp: aiohttp
  AiohttpAsyncHttpClient: linebot.aiohttp_async_http_client.AiohttpAsyncHttpClient
  asyncio: asyncio
  AsyncLineBotApi: linebot.AsyncLineBotApi
  BytesIO: io.BytesIO
  datetime: datetime
  FastAPI: fastapi.FastAPI
  get_current_time: multi_tool_agent.agent.get_current_time
  get_weather: multi_tool_agent.agent.get_weather
  HTTPException: fastapi.HTTPException
  InMemorySessionService: google.adk.sessions.InMemorySessionService
  InvalidSignatureError: linebot.exceptions.InvalidSignatureError
  MessageEvent: linebot.models.MessageEvent
  os: os
  Request: fastapi.Request
  Runner: google.adk.runners.Runner
  Session: google.adk.sessions.Session
  sys: sys
  TextSendMessage: linebot.models.TextSendMessage
  types: google.genai.types
  WebhookParser: linebot.WebhookParser
  ZoneInfo: zoneinfo.ZoneInfo

functions:
  call_agent_async:
    type: async
    module: main
    args: [query, user_id]
    params:
      returns: str
  get_current_time:
    type: sync
    module: multi_tool_agent.agent
    args: [city]
    params:
      returns: dict
  get_or_create_session:
    type: async
    module: main
    args: [user_id]
  get_weather:
    type: sync
    module: multi_tool_agent.agent
    args: [city]
    params:
      returns: dict
  handle_callback:
    type: async
    module: main
    args: [request]

variables:
  ChannelAccessToken:
    type: env
    params:
      caller: [os.getenv]
      path: [main]
  ChannelSecret:
    type: env
    params:
      caller: [os.getenv]
      path: [main]
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [main]
  GOOGLE_CLOUD_LOCATION:
    type: env
    params:
      caller: [os.getenv]
      path: [main]
  GOOGLE_CLOUD_PROJECT:
    type: env
    params:
      caller: [os.getenv]
      path: [main]
  GOOGLE_GENAI_USE_VERTEXAI:
    type: env
    params:
      caller: [os.getenv]
      path: [main]
